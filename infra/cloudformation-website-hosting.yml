AWSTemplateFormatVersion: '2010-09-09'
Description: >
  uppush.io marketing site: private S3 bucket + CloudFront (OAC, edge function for
  URL rewrite + WordPress-migration 301/410s, security headers) + IAM role that GitHub Actions assumes via OIDC
  to deploy. The ACM certificate must already exist in us-east-1.

Parameters:
  DomainName:
    Type: String
    Default: uppush.io
    Description: Apex domain (www.<domain> is added and redirected to it).
  AcmCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:\d{12}:certificate/.+$'
    Description: >
      ACM certificate in us-east-1 covering the apex domain (and www.<domain> when
      IncludeWww is true).
  IncludeWww:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Also serve www.<domain> (redirected to the apex by the edge function). Set to false
      to use a certificate that only covers the apex; www then has no site.
  GitHubOwner:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
    Description: GitHub user or organisation that owns the repository (e.g. dungfv).
  GitHubRepo:
    Type: String
    Default: uppush-branding
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
    Description: Repository name (without the owner).
  DeployEnvironment:
    Type: String
    Default: production
    Description: >
      GitHub environment of the deploy job. Restrict it to the main branch in
      GitHub (Settings → Environments → Deployment branches).
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: >
      Leave empty to create the GitHub OIDC provider. An AWS account can hold only
      one provider for token.actions.githubusercontent.com — pass its ARN if it exists.
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

  # ── Naming (all optional). Decide before the first create: renaming the bucket or
  #    the role later replaces the resource (the old bucket is retained, not deleted).
  NamePrefix:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9-]{0,39}$'
    Description: >
      Prefix for the OAC, CloudFront function, response-headers policy and Name/Project
      tags, e.g. uppush-web-prod. Empty = the stack name.
  BucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    Description: >
      S3 bucket name (globally unique, lowercase, digits and hyphens, no dots),
      e.g. uppush-website-prod. Empty = generated by CloudFormation.
  DeployRoleName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9+=,.@_-]{1,64}$'
    Description: >
      IAM role name for GitHub Actions, e.g. uppush-website-github-deploy.
      Empty = generated. Requires --capabilities CAPABILITY_NAMED_IAM when set.
  DistributionComment:
    Type: String
    Default: ''
    MaxLength: 128
    Description: Description shown in the CloudFront console. Empty = "<domain> marketing site".

  # ── Contact form backend (/api/contact → Lambda → DynamoDB + SNS email).
  TurnstileSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      Cloudflare Turnstile secret key for the contact form (Cloudflare dashboard → Turnstile).
      Empty = every submission is rejected as spam, so set it before enabling the form.
  ContactNotifyEmail:
    Type: String
    Default: ''
    Description: Address that gets an email for each submission (confirm the SNS subscription email once). Empty = store only.
  ContactRetentionDays:
    Type: Number
    Default: 730
    MinValue: 30
    Description: Submissions are deleted automatically after this many days (GDPR storage limitation).

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
  HasNamePrefix: !Not [!Equals [!Ref NamePrefix, '']]
  WithWww: !Equals [!Ref IncludeWww, 'true']
  HasContactNotifyEmail: !Not [!Equals [!Ref ContactNotifyEmail, '']]
  HasBucketName: !Not [!Equals [!Ref BucketName, '']]
  HasDeployRoleName: !Not [!Equals [!Ref DeployRoleName, '']]
  HasDistributionComment: !Not [!Equals [!Ref DistributionComment, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasBucketName, !Ref BucketName, !Ref 'AWS::NoValue']
      Tags:
        - { Key: Name, Value: !Sub ['${Prefix}-site', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }] }
        - { Key: Project, Value: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ['${Prefix}-oac', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }]
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Static-site routing that S3 (REST origin) does not do on its own:
  #   www.<domain>/x  -> 301 https://<domain>/x
  #   /about          -> 301 /about/        (site uses trailingSlash: 'always')
  #   /about/         -> /about/index.html  (internal rewrite)
  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ['${Prefix}-url-rewrite', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }]
      AutoPublish: true
      FunctionConfig:
        Comment: www redirect, WordPress 301/410 rules, trailing slash, index.html rewrite (npm run redirects)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        // BEGIN GENERATED FUNCTION
        // GENERATED by scripts/build-redirects.mjs from docs/url-inventory.csv — do not edit by hand.
        var R = {"/category/insights/":"/blog/","/category/news-trends/":"/blog/","/category/technology/":"/blog/","/category/marketing/marketing-strategy-roi/":"/category/marketing/","/category/web-push/":"/blog/","/category/software/":"/blog/","/author/up_marketing/":"/blog/","/author/admin/":"/blog/","/feed/":"/rss.xml","/blog/feed/":"/rss.xml","/sitemap.xml":"/sitemap-index.xml","/sitemap_index.xml":"/sitemap-index.xml","/wp-sitemap.xml":"/sitemap-index.xml","/post-sitemap.xml":"/sitemap-index.xml","/page-sitemap.xml":"/sitemap-index.xml","/category-sitemap.xml":"/sitemap-index.xml","/post_tag-sitemap.xml":"/sitemap-index.xml","/author-sitemap.xml":"/sitemap-index.xml","/elementskit_content-sitemap.xml":"/sitemap-index.xml","/elementskit_template-sitemap.xml":"/sitemap-index.xml","/keydesign-portfolio-sitemap.xml":"/sitemap-index.xml","/keydesign-portfolio-category-sitemap.xml":"/sitemap-index.xml"};
        var KEEP_TAGS = {"email-marketing":1,"boost-sales":1,"email-automation":1,"abandoned-cart-recovery":1,"ecommerce-marketing":1,"free-features":1,"shopify":1};
        var GONE = ["/portfolio/","/portfolio-category/","/elementskit-content/","/wp-admin","/wp-login.php","/xmlrpc.php","/wp-json/","/comments/feed/"];
        var GONE_EXACT = {};
        var IDS = {"881":"/web-push/","883":"/contact/","8820":"/getting-started-with-email-marketing-for-shopify-stores/","8822":"/10-essential-email-campaigns-every-shopify-merchant-should-run/","8824":"/boosting-sales-with-abandoned-cart-email-automation/","8826":"/designing-effective-email-templates-to-increase-engagement/","8828":"/how-to-use-a-b-testing-to-improve-email-campaign-results/","8830":"/building-a-welcome-email-series-to-onboard-new-customers/","8832":"/seasonal-email-campaign-ideas-for-shopify-merchants/","8834":"/understanding-email-metrics-and-analyzing-campaign-performance/","8836":"/the-role-of-email-marketing-in-customer-retention/","8838":"/how-to-use-triggered-emails-to-drive-conversions-on-shopify/","8840":"/writing-subject-lines-that-capture-attention-and-drive-opens/","8842":"/using-email-and-web-push-together-to-reach-more-customers/","9379":"/best-practices-for-sending-browser-push-notifications-to-engage-your-customers/","9393":"/how-to-use-push-notifications-to-recover-abandoned-carts-in-shopify/","9427":"/optimal-frequency-for-sending-web-push-notifications-how-many-campaigns-should-you-send/","21027":"/faq/","21040":"/terms-and-conditions/","21780":"/","21782":"/blog/","22213":"/about/","22291":"/exciting-news-uppush-introduces-flexible-usage-based-pricing/","22326":"/privacy-policy/","22421":"/why-domain-verification-matters-in-email-marketing-and-how-it-impacts-conversion-rates/","22423":"/unlocking-sales-with-email-why-every-shopify-store-needs-campaigns-that-convert/","22447":"/from-first-visit-to-first-sale-nurturing-leads-with-email-campaigns/","22449":"/introducing-blocked-email-domains-in-uppush/","22453":"/introducing-email-list-cleaning-in-uppush/","22655":"/reach-more-shoppers-with-free-web-push-notifications/","22664":"/how-to-get-your-logo-avatar-or-profile-picture-to-appear-next-to-your-emails/","22715":"/grow-your-list-with-free-email-popups/","22807":"/automate-your-marketing-for-free/","22849":"/partners/","23042":"/pricing/","23077":"/how-to-warm-your-sending-domain-in-uppush-2/","23197":"/how-to-increase-your-email-open-rate-a-practical-guide-to-getting-campaigns-noticed/","23222":"/marketing-roi-decoded-how-email-sms-and-paid-ads-compare-and-how-to-get-the-most-from-your-email-spend/","23231":"/spf-dkim-and-dmarc-explained-why-verifying-your-email-records-actually-matters/","23245":"/the-welcome-email-series-how-to-turn-new-subscribers-into-first-time-buyers/","23254":"/abandoned-cart-emails-how-to-recover-the-sales-youre-already-losing/","23371":"/why-choose-uppush/","23641":"/how-small-stores-compete-with-big-brands-without-big-budgets/","23665":"/why-every-campaign-needs-an-unsubscribe-link/","23963":"/marketing-services-by-uppush/","24105":"/top-10-klaviyo-alternatives-for-shopify-and-ecommerce/","24115":"/shopify-email-marketing-a-complete-guide-for-beginners/","24120":"/how-to-recover-abandoned-carts-on-shopify/","24129":"/web-push-notifications-the-complete-guide/","24132":"/email-vs-push-notifications-which-should-you-use/","24148":"/7-shopify-marketing-automations-every-store-should-set-up/","24153":"/abandoned-cart-email-examples-that-bring-shoppers-back/","24156":"/shopify-abandoned-checkout-why-shoppers-leave-and-how-to-bring-them-back/","24159":"/browse-abandonment-vs-cart-abandonment-the-difference/","24162":"/how-to-create-a-shopify-welcome-email-series-that-converts/","24173":"/back-in-stock-how-to-turn-restocks-into-sales/","24178":"/price-drop-notifications-a-simple-way-to-bring-shoppers-back/","24184":"/shopify-pop-up-examples-that-actually-grow-your-email-list/","24187":"/spin-to-win-popups-do-they-actually-increase-conversions/","24190":"/how-to-grow-your-shopify-email-list-without-spending-more-on-ads/","24193":"/klaviyo-vs-omnisend-which-is-better-for-shopify/","24216":"/best-shopify-web-push-notification-apps/","24219":"/win-back-email-how-to-bring-inactive-customers-back/","24223":"/shopify-email-deliverability-how-to-keep-your-emails-out-of-spam/","24228":"/how-to-turn-first-time-buyers-into-repeat-customers/","24234":"/how-to-send-the-right-message-to-the-right-customer/","24237":"/how-to-create-a-shopify-email-marketing-strategy-from-scratch/"};

        function qs(request) {
          var parts = [];
          var params = request.querystring;
          for (var key in params) {
            var entry = params[key];
            var values = entry.multiValue ? entry.multiValue : [entry];
            for (var i = 0; i < values.length; i++) parts.push(values[i].value === '' ? key : key + '=' + values[i].value);
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function moved(location) {
          return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: location }, 'cache-control': { value: 'public, max-age=86400' } } };
        }

        function gone() {
          return { statusCode: 410, statusDescription: 'Gone', headers: { 'cache-control': { value: 'public, max-age=86400' } } };
        }

        // www.<domain>: answer with ONE 301 straight to the final apex URL (no redirect chains),
        // by running the apex rules first and turning their result into an absolute redirect.
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host.indexOf('www.') !== 0) return route(request);
          var apex = 'https://' + host.substring(4);
          var original = request.uri;
          var out = route(request);
          if (out.statusCode === 301) {
            var loc = out.headers.location.value;
            return moved(loc.charAt(0) === '/' ? apex + loc : loc);
          }
          if (out.statusCode) return out; // 410 Gone stays 410
          return moved(apex + original + qs(request));
        }

        function route(request) {
          var uri = request.uri;
          var q = request.querystring;

          // WordPress shortlinks and query-string pages on the home page.
          if (uri === '/') {
            var id = (q.p && q.p.value) || (q.page_id && q.page_id.value);
            if (id) return moved(IDS[id] || '/');
            if (q.elementskit_template) return gone();
          }

          var path = uri.charAt(uri.length - 1) === '/' ? uri : uri + '/';
          for (var g = 0; g < GONE.length; g++) if (uri.indexOf(GONE[g]) === 0) return gone();
          if (GONE_EXACT[path]) return gone();
          if (R[path] || R[uri]) return moved(R[path] || R[uri]); // pages and files (/sitemap.xml)
          if (/\/feed\/$/.test(path)) return moved('/rss.xml');
          if (path.indexOf('/author/') === 0) return moved('/blog/');
          var tag = path.match(/^\/tag\/([^/]+)\//);
          if (tag && !KEEP_TAGS[tag[1]]) return moved('/blog/');

          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') !== -1) return request; // a file: /rss.xml, /_astro/x.css, /pagefind/...
          if (uri.charAt(uri.length - 1) !== '/') return moved(uri + '/' + qs(request));
          request.uri = uri + 'index.html';
          return request;
        }
        // END GENERATED FUNCTION

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ['${Prefix}-security-headers', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }]
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://*.crisp.chat https://*.googletagmanager.com https://challenges.cloudflare.com;
              style-src 'self' 'unsafe-inline' https://*.crisp.chat;
              img-src 'self' data: https://*.crisp.chat https://*.google-analytics.com https://*.googletagmanager.com;
              font-src 'self' https://*.crisp.chat; media-src 'self' https://*.crisp.chat;
              connect-src 'self' https://*.crisp.chat wss://*.relay.crisp.chat wss://*.relay.rescue.crisp.chat
              https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;
              frame-src 'self' https://*.crisp.chat https://*.crisp.help https://challenges.cloudflare.com https://www.youtube-nocookie.com; worker-src 'self' blob: https://*.crisp.chat;
              form-action 'self' mailto: https://formspree.io https://api.web3forms.com;
              frame-ancestors 'none'; base-uri 'self'; object-src 'none'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - { Key: Name, Value: !Sub ['${Prefix}-cdn', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }] }
        - { Key: Project, Value: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }
      DistributionConfig:
        Enabled: true
        Comment: !If [HasDistributionComment, !Ref DistributionComment, !Sub '${DomainName} marketing site']
        Aliases: !If
          - WithWww
          - [!Ref DomainName, !Sub 'www.${DomainName}']
          - [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: contact-api
            # https://<id>.lambda-url.<region>.on.aws/ → <id>.lambda-url.<region>.on.aws
            DomainName: !Select [2, !Split ['/', !GetAtt ContactFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # Same-origin API: the form posts to /api/contact, so no CORS and the CSP stays 'self'.
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: contact-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized": honours the Cache-Control set at upload time
          # (immutable for /_astro/*, s-maxage + invalidation for HTML).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        # With OAC, a missing object comes back as 403: serve the 404 page for both.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # ── Contact form backend ────────────────────────────────────────────────────
  ContactTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ['${Prefix}-contact-submissions', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: Project, Value: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }

  ContactTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ['${Prefix}-contact', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }]
      KmsMasterKeyId: alias/aws/sns

  ContactTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasContactNotifyEmail
    Properties:
      TopicArn: !Ref ContactTopic
      Protocol: email
      Endpoint: !Ref ContactNotifyEmail

  ContactFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: contact-form
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ContactTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ContactTopic

  ContactFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub ['/aws/lambda/${Prefix}-contact', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }]
      RetentionInDays: 90

  ContactFunction:
    Type: AWS::Lambda::Function
    DependsOn: ContactFunctionLogs
    Properties:
      FunctionName: !Sub ['${Prefix}-contact', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }]
      Description: uppush.io contact form (Turnstile → DynamoDB + SNS)
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ContactFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref ContactTable
          TOPIC_ARN: !If [HasContactNotifyEmail, !Ref ContactTopic, '']
          TURNSTILE_SECRET: !Ref TurnstileSecretKey
          RETENTION_DAYS: !Ref ContactRetentionDays
      Code:
        ZipFile: |
          // Contact form handler. Verifies Cloudflare Turnstile, stores the submission in DynamoDB,
          // notifies by SNS email. Never returns 403/404 (CloudFront maps those to the 404 page).
          const { DynamoDBClient, PutItemCommand } = require('@aws-sdk/client-dynamodb');
          const { SNSClient, PublishCommand } = require('@aws-sdk/client-sns');
          const db = new DynamoDBClient({});
          const sns = new SNSClient({});
          const E = process.env;
          const TOPICS = ['general', 'support', 'managed-service', 'partnership', 'billing'];

          const reply = (ev, code, body) => {
            const json = /json/.test(ev.headers?.accept || '');
            if (!json) return { statusCode: 303, headers: { location: code === 200 ? '/contact/thanks/' : '/contact/?error=' + body.error } };
            return { statusCode: code, headers: { 'content-type': 'application/json', 'cache-control': 'no-store' }, body: JSON.stringify(body) };
          };

          exports.handler = async (ev) => {
            if (ev.requestContext?.http?.method !== 'POST') return reply(ev, 405, { error: 'method' });
            let raw = ev.body || '';
            if (ev.isBase64Encoded) raw = Buffer.from(raw, 'base64').toString();
            if (raw.length > 20000) return reply(ev, 413, { error: 'too_large' });
            let f;
            try {
              f = /json/.test(ev.headers?.['content-type'] || '') ? JSON.parse(raw) : Object.fromEntries(new URLSearchParams(raw));
            } catch {
              return reply(ev, 400, { error: 'bad_request' });
            }
            const s = (k, n) => String(f[k] ?? '').trim().slice(0, n);
            if (s('botcheck', 10)) return reply(ev, 200, { ok: true }); // honeypot: pretend success
            const email = s('email', 254).toLowerCase();
            const name = s('name', 120);
            const message = s('message', 2000);
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || !name || !message) return reply(ev, 422, { error: 'invalid' });

            const ip = (ev.headers?.['x-forwarded-for'] || '').split(',')[0].trim();
            const check = await fetch('https://challenges.cloudflare.com/turnstile/v0/siteverify', {
              method: 'POST',
              body: new URLSearchParams({ secret: E.TURNSTILE_SECRET || '', response: s('cf-turnstile-response', 2048), remoteip: ip }),
            }).then((r) => r.json()).catch(() => ({ success: false }));
            if (!check.success) return reply(ev, 400, { error: 'captcha' });

            const now = new Date();
            const topic = TOPICS.includes(f.topic) ? f.topic : 'general';
            const subscribe = ['on', 'true', '1', 'yes'].includes(String(f.subscribe));
            const store = s('store', 200);
            const page = s('page', 200);
            await db.send(new PutItemCommand({
              TableName: E.TABLE,
              Item: {
                id: { S: crypto.randomUUID() },
                createdAt: { S: now.toISOString() },
                email: { S: email },
                name: { S: name },
                topic: { S: topic },
                message: { S: message },
                subscribe: { BOOL: subscribe },
                store: { S: store || '-' },
                page: { S: page || '-' },
                expiresAt: { N: String(Math.floor(now.getTime() / 1000) + 86400 * Number(E.RETENTION_DAYS || 730)) },
              },
            }));
            if (E.TOPIC_ARN) {
              await sns.send(new PublishCommand({
                TopicArn: E.TOPIC_ARN,
                Subject: ('Uppush contact (' + topic + '): ' + name).slice(0, 100),
                Message: 'From: ' + name + ' <' + email + '>\nTopic: ' + topic + '\nStore: ' + (store || '-') +
                  '\nProduct updates opt-in: ' + (subscribe ? 'yes' : 'no') + '\nPage: ' + (page || '-') + '\n\n' + message,
              })).catch((e) => console.error('sns', e));
            }
            return reply(ev, 200, { ok: true });
          };

  ContactFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ContactFunction.Arn
      AuthType: NONE

  # Public function URLs need both permissions (InvokeFunction only via the URL).
  ContactFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ContactFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  ContactFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ContactFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [HasDeployRoleName, !Ref DeployRoleName, !Ref 'AWS::NoValue']
      Tags:
        - { Key: Name, Value: !Sub ['${Prefix}-github-deploy', { Prefix: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }] }
        - { Key: Project, Value: !If [HasNamePrefix, !Ref NamePrefix, !Ref 'AWS::StackName'] }
      Description: !Sub 'Deploys ${DomainName} from ${GitHubOwner}/${GitHubRepo} (environment ${DeployEnvironment})'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !GetAtt GitHubOidcProvider.Arn
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Jobs with `environment: <DeployEnvironment>` send this subject; the
              # environment's branch rule (main only) keeps other branches out. GitHub
              # issues either owner/repo or owner@<id>/repo@<id> — both are accepted.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepo}:environment:${DeployEnvironment}'
                  - !Sub 'repo:${GitHubOwner}@*/${GitHubRepo}@*:environment:${DeployEnvironment}'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Description: GitHub variable S3_BUCKET
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub variable CLOUDFRONT_DISTRIBUTION_ID
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point the apex and www ALIAS records here (test the site on it first)
    Value: !GetAtt Distribution.DomainName
  ContactTableName:
    Description: DynamoDB table with contact form submissions (npm run contacts:export)
    Value: !Ref ContactTable
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
